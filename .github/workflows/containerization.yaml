name: Containerization

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  federation-e2e:
    # Builds the image and runs a real federation: 1 server + 5 client containers over the compose network.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the federation with Docker Compose
        run: docker compose -f docker/docker-compose.yml up --build --abort-on-container-exit --exit-code-from server
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
